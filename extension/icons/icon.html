<!doctype html>
<!-- The icon, drawn at 512 px for render.sh: the Chinese flag's red and
     yellow, rounded as Miro's favicon, with a Chinese character in Noto
     Sans SC Black, from the extension's own font slices. icon.html?c=汉
     draws another. -->
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Icon";
    font-weight: 900;
    src: url(../fonts/sc/sans-87.woff2) format("woff2"); /* 中 */
    unicode-range: U+4E2D;
  }
  @font-face {
    font-family: "Icon";
    font-weight: 900;
    src: url(../fonts/sc/sans-82.woff2) format("woff2"); /* 汉 */
    unicode-range: U+6C49;
  }
  html, body { margin: 0; background: transparent; }
  div {
    width: 512px; height: 512px;
    border-radius: 22%;
    background: #de2910;
    color: #ffde00;
    font: 900 400px/512px "Icon";
    text-align: center;
  }
</style>
<div id="c">中</div>
<script>
  const c = new URLSearchParams(location.search).get("c");
  if (c) document.getElementById("c").textContent = c;
</script>
